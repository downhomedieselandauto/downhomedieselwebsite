<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" type="image/png" href="favicon.png">
      <title>Down Home Diesel & Auto</title>
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
        body {
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
          background: url("background-img.png") center / cover fixed no-repeat;
          color: #222;
          line-height: 1.5;
        }
        header,
        footer {
          color: white;
          text-align: center;
        }
        header {
          padding: 0 15px;
        }
        .header-image {
          display: block;
          max-width: 90%;
          max-height: 180px;
          margin: 0 auto;
        }
        main {
          max-width: 720px;
          margin: 35px auto;
          padding: 0 25px;
        }
        .contact-box {
          background: rgba(255, 255, 255, 0.94);
          box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
          border-radius: 12px;
          padding: 26px 22px;
        }
        .contact-box h1 {
          font-size: 30px;
          font-weight: 700;
          letter-spacing: -0.03em;
          margin-bottom: 14px;
          border-bottom: 2px solid #c40000;
          padding-bottom: 8px;
          color: #1d1d1d;
        }
        .contact-box p {
          margin: 12px 0;
          font-size: 16px;
          color: #2c2c2c;
          line-height: 1.5;
        }
        .contact-box .intro {
          font-size: 17px;
          color: #3d3d3d;
          margin-bottom: 18px;
        }
        .contact-box a {
          color: #c40000;
          font-weight: 700;
          text-decoration: none;
          overflow-wrap: anywhere;
        }
        .contact-box a:hover {
          text-decoration: underline;
        }
        .facebook-link {
          display: inline-block;
          margin-top: 10px;
        }
        footer {
          padding: 8px 15px;
          margin-top: 30px;
        }
        footer p {
          margin: 5px 0;
          font-size: 10px;
        }
        @media (max-width: 700px) {
          .header-image {
            max-width: 95%;
            max-height: 130px;
          }
          main {
            margin: 20px auto;
            padding: 0 10px;
          }
          .contact-box {
            padding: 22px 12px;
            border-radius: 10px;
          }
          .contact-box h1 {
            font-size: 27px;
          }
        }
      </style>
  </head>
  <body>
    <header>
      <img
        src="header-img.png"
        alt="Down Home Diesel & Auto"
        class="header-image">
    </header>
    <main>
      <section class="contact-box">
        <h1>Contact Us</h1>
        <p class="intro">Give us a call or stop by for more information about our diesel and automotive services.</p>
        <p><strong>Owner: Michael Servoss</strong></p>
        <p>
          <strong>Address:</strong><br>
          3431 North Carolina Hwy 150<br>
          Lincolnton, NC 28092
        </p>
        <p>
          <strong>Phone:</strong><br>
          <a href="tel:7042403408">704-240-3408</a>
        </p>
        <p>
          <strong>Email:</strong><br>
          <a href="mailto:DownHomeDieselAutomotive@outlook.com">DownHomeDieselAutomotive@outlook.com</a>
        </p>
        <p>
          <a class="facebook-link" href="https://www.facebook.com/p/Down-Home-Diesel-Automotive-61581431172268/" target="_blank" rel="noopener noreferrer" aria-label="Down Home Diesel & Automotive Facebook page">
            <img src="Facebook_Logo_Primary.png" alt="Facebook" width="40" height="40">
          </a>
        </p>
      </section>
    </main>
    <footer>
      <p>Created by TTD</p>
    </footer>
  </body>
</html>
