<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Down Home Diesel & Auto</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-image: url("background-img.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: #000000;
      color: white;
      text-align: center;
      padding: 1px 15px 0;
    }

    .header-image {
      display: block;
      width: auto;
      max-width: 90%;
      height: auto;
      max-height: 180px;
      margin: 0 auto 20px auto;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 25px;
    }

    .content-box {
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
      padding: 45px 25px;
    }

    .content-box h1 {
      font-size: 32px;
      margin-bottom: 20px;
      border-bottom: 3px solid #c40000;
      padding-bottom: 8px;
    }

    .content-box p {
      margin: 14px 0;
      font-size: 17px;
    }

    .contact-box {
      margin-top: 30px;
      padding: 25px;
      border: 1px solid #ddd;
      background: #f7f7f7;
    }

    .contact-box h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 28px;
    }

    .contact-box p {
      margin: 10px 0;
    }

    .contact-box a {
      color: #c40000;
      font-weight: bold;
    }

    .facebook-link {
      display: inline-block;
      margin-top: 10px;
    }

    footer {
      background: transparent;
      color: white;
      text-align: center;
      padding: 8px 15px;
      margin-top: 30px;
    }

    footer p {
      margin: 5px 0;
      font-size: 10px;
    }

    @media (max-width: 700px) {
      .header-image {
        max-width: 95%;
        max-height: 130px;
      }

      main {
        margin: 20px auto;
        padding: 0 10px;
      }

      .content-box {
        padding: 30px 15px;
      }

      .content-box h1 {
        font-size: 27px;
      }
    }
  </style>
</head>
<body>
  <header>
    <img
      src="header-img.png"
      alt="Down Home Diesel & Auto"
      class="header-image">
  </header>

  <main>
    <section class="content-box">
      <h1>Welcome</h1>

      <p>
        Give us a call or stop by for more information about our diesel and automotive services.
      </p>

      <div class="contact-box">
        <h2>Contact Us</h2>

        <p><strong>Owner: Michael Servoss</strong></p>

        <p>
          <strong>Address:</strong><br>
          3431 North Carolina Hwy 150<br>
          Lincolnton, NC 28092
        </p>

        <p>
          <strong>Phone:</strong><br>
          <a href="tel:7042403408">704-240-3408</a>
        </p>

        <p>
          <strong>Email:</strong><br>
          <a href="mailto:DownHomeDieselAutomotive@outlook.com">DownHomeDieselAutomotive@outlook.com</a>
        </p>

        <p>
          <a class="facebook-link" href="https://www.facebook.com/p/Down-Home-Diesel-Automotive-61581431172268/" target="_blank" rel="noopener noreferrer" aria-label="Down Home Diesel & Automotive on Facebook">
            <img src="Facebook_Logo_Primary.png" alt="Facebook" width="40" height="40">
          </a>
        </p>
      </div>
    </section>
  </main>

  <footer>
    <p>Created by TTD</p>
  </footer>
</body>
</html>
